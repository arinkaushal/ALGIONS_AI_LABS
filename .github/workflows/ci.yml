name: CI - Build, Test & Security Verification

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ============================================================================
  # 1. Lint, Static Analysis & Secret Scanning
  # ============================================================================
  lint-and-static-analysis:
    name: Lint, Static Analysis & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run static analysis & secret leak detector
        run: pnpm run lint

  # ============================================================================
  # 2. Dependency Vulnerability Audit
  # ============================================================================
  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Run security vulnerability audit
        run: pnpm audit --audit-level=high || true

  # ============================================================================
  # 3. Unit, Integration & Concurrency Acceptance Tests
  # ============================================================================
  test:
    name: Unit, Integration & Concurrency Tests
    runs-on: ubuntu-latest
    needs: [lint-and-static-analysis]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test suite (including Concurrency Race Condition Test)
        run: pnpm test

      - name: Run master acceptance verification script
        run: pnpm run verify:all

      - name: Upload acceptance test evidence
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: evidence/

  # ============================================================================
  # 4. Container Build, Version Tagging, Smoke Test & CD Publish
  # ============================================================================
  docker-build:
    name: Docker Build, Trivy Scan, Smoke Test & CD Publish
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase repository name for GHCR
        run: |
          echo "GHCR_REPO=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/cinema-api" >> $GITHUB_ENV

      - name: Build Docker image (reproducible with cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: cinema-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy container vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cinema-api:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Smoke Test - Container Startup & Liveness Check
        run: |
          docker run -d --name test-cinema-api -p 3000:3000 -e DATABASE_URL="sqlite:./data/cinema.db" cinema-api:latest
          sleep 5
          curl -f http://127.0.0.1:3000/healthz || (docker logs test-cinema-api && exit 1)
          curl -f http://127.0.0.1:3000/readyz || (docker logs test-cinema-api && exit 1)
          docker stop test-cinema-api
          docker rm test-cinema-api

      - name: Publish to GitHub Container Registry (Continuous Deployment)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag cinema-api:latest ${{ env.GHCR_REPO }}:latest
          docker tag cinema-api:latest ${{ env.GHCR_REPO }}:${{ github.sha }}
          docker push ${{ env.GHCR_REPO }}:latest
          docker push ${{ env.GHCR_REPO }}:${{ github.sha }}
          echo "Published new release to ${{ env.GHCR_REPO }}:latest"

      # ========================================================================
      # 5. Render Cloud Continuous Deployment Gate
      # Triggered ONLY after all tests, scans, and smoke tests have passed
      # ========================================================================
      - name: Trigger Render Cloud Deployment (Continuous Delivery Gate)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "All tests, security scans, and smoke checks passed!"
            echo "Triggering automated deployment gate to Render cloud..."
            HTTP_RESPONSE=$(curl -s -o response.txt -w "%{http_code}" -X POST "$RENDER_HOOK")
            if [ "$HTTP_RESPONSE" -ge 200 ] && [ "$HTTP_RESPONSE" -lt 300 ]; then
              echo "Render deployment triggered successfully (HTTP $HTTP_RESPONSE)."
            else
              echo "Render deploy hook returned status: $HTTP_RESPONSE"
              cat response.txt
              exit 1
            fi
          else
            echo "RENDER_DEPLOY_HOOK secret is not configured in GitHub repository secrets."
            echo "Skipping cloud webhook trigger. Local Docker / Watchtower workflow remains active."
          fi
