name: CI - Build, Test & Security Verification

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # 1. Lint, Static Analysis & Secret Scanning
  # ============================================================================
  lint-and-static-analysis:
    name: Lint, Static Analysis & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run static analysis & secret leak detector
        run: pnpm run lint

  # ============================================================================
  # 2. Dependency Vulnerability Audit
  # ============================================================================
  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Run security vulnerability audit
        run: pnpm audit --audit-level=high || true

  # ============================================================================
  # 3. Unit, Integration & Concurrency Acceptance Tests
  # ============================================================================
  test:
    name: Unit, Integration & Concurrency Tests
    runs-on: ubuntu-latest
    needs: [lint-and-static-analysis]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test suite (including Concurrency Race Condition Test)
        run: pnpm test

      - name: Run master acceptance verification script
        run: pnpm run verify:all

      - name: Upload acceptance test evidence
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: evidence/

  # ============================================================================
  # 4. Container Build, Version Tagging & Smoke Healthcheck
  # ============================================================================
  docker-build:
    name: Docker Build, Trivy Scan & Healthcheck
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata & version tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: cinema-api
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (reproducible with cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy container vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cinema-api:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Smoke Test - Container Startup & Liveness Check
        run: |
          docker run -d --name test-cinema-api -p 3000:3000 -e DATABASE_URL="sqlite:./data/cinema.db" cinema-api:latest
          sleep 5
          curl -f http://127.0.0.1:3000/healthz || (docker logs test-cinema-api && exit 1)
          curl -f http://127.0.0.1:3000/readyz || (docker logs test-cinema-api && exit 1)
          docker stop test-cinema-api

